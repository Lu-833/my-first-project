<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>我的第一个项目</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app">
      <header class="app-header">
        <p class="eyebrow">GitHub 入门练习</p>
        <h1>今日待办</h1>
        <p class="subtitle">记录今天要做的事，完成后勾选即可。</p>
      </header>

      <form id="todo-form" class="todo-form">
        <label class="sr-only" for="todo-input">输入待办事项</label>
        <input
          id="todo-input"
          type="text"
          maxlength="80"
          placeholder="例如：学习 GitHub 上传项目"
          autocomplete="off"
          required
        />
        <button type="submit">添加</button>
      </form>

      <ul id="todo-list" class="todo-list" aria-live="polite"></ul>

      <footer class="app-footer">
        <p id="todo-count">还没有待办事项</p>
        <button id="clear-completed" type="button">清除已完成</button>
      </footer>
    </main>

    <script src="script.js"></script>
  </body>
</html>
