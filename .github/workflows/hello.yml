name: Hello Actions

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  hello:
    runs-on: ubuntu-latest

    steps:
      - name: Say hello
        run: echo "Hello from GitHub Actions"

      - name: Show repository
        run: echo "Repository: ${{ github.repository }}"

      - name: Show commit
        run: echo "Commit: ${{ github.sha }}"

      - name: Check index.html
        run: test -f index.html
